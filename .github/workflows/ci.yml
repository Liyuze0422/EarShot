name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装静态检查与测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6" "pytest>=8.0"
      - name: 语法编译（server / ui / tools）
        run: python -m compileall -q server ui tools
      - name: Ruff 静态检查
        run: ruff check .
      - name: 快照测试（不需要模型、音频设备与网络）
        run: pytest -q

  hygiene:
    # 只跑仓库卫生检查：防止个人路径、密钥、私有材料被误提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8.0"
      - run: pytest -q tests/test_repo_hygiene.py
