name: release

# 推一个 v* tag，这个 workflow 负责在 Windows 上打包并把资产挂到 Release 上。
#
# ⚠️ 诚实提醒：**这条路径至今没有跑通过。** 它要在 runner 上装
# funasr / onnxruntime / PyQt6（合起来上 GB），能不能装成功、会不会超时都不知道。
# 现在真正在用、并且实测过的是本地的 tools/release.py —— 见 docs/更新与发版.md。
# 哪天这个 workflow 跑绿了，再把文档里的「推荐做法」改成它。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Read version
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path server\version.py -Pattern "__version__\s*=\s*'([^']+)'"
          $ver = $m.Matches[0].Groups[1].Value
          "ver=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "version = $ver"
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm EarShot.spec
      - name: Make manifest and full package
        run: python tools\make_release.py --dir dist\EarShot --version ${{ steps.v.outputs.ver }} --out build\release --full --embed
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*-win64-full.zip
            build/release/manifest-v*.json
